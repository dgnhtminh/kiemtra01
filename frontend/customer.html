<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        const API_URL = "http://localhost:8000";
        let customerId = null;

        function normalizeCustomerId() {
            const storedId = localStorage.getItem("customerId");
            if (!storedId || storedId === "undefined" || storedId === "null") {
                customerId = null;
                return null;
            }
            customerId = storedId;
            return customerId;
        }

        async function init() {
            normalizeCustomerId();
            if (customerId) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('main-section').style.display = 'block';
                document.getElementById('welcome-msg').innerText = "Welcome back, Customer #" + customerId;
                loadCart();
                loadStaffItems();
                loadAllProducts();
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('main-section').style.display = 'none';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/customer/customers/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("customerId", String(data.id));
                    customerId = String(data.id);
                    location.reload();
                } else {
                    alert("Invalid credentials. Try registering instead or check your password.");
                }
            } catch (error) {
                console.error(error);
                alert("Login failed.");
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = email.split('@')[0];

            try {
                // Register
                const res = await fetch(`${API_URL}/customer/customers/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone: "", address: "" })
                });
                if (res.ok) {
                    alert("Registration successful. You can now login!");
                    await handleLogin(e);
                } else {
                    const err = await res.json();
                    alert("Registration failed: " + err.detail);
                }
            } catch (error) {
                alert("Registration error.");
            }
        }

        function logout() {
            localStorage.removeItem("customerId");
            location.reload();
        }

        async function searchProducts(e) {
            e.preventDefault();
            const q = document.getElementById('search-query').value;
            const type = document.getElementById('search-type').value; // 'laptop' or 'mobile'
            
            try {
                const res = await fetch(`${API_URL}/${type}/${type}s/?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                renderProductResults(data, type);
            } catch (error) {
                console.error(error);
                alert("Search failed.");
            }
        }

        async function loadAllProducts() {
            try {
                const [laptopsRes, mobilesRes] = await Promise.all([
                    fetch(`${API_URL}/laptop/laptops/`),
                    fetch(`${API_URL}/mobile/mobiles/`)
                ]);

                const [laptops, mobiles] = await Promise.all([
                    laptopsRes.ok ? laptopsRes.json() : [],
                    mobilesRes.ok ? mobilesRes.json() : []
                ]);

                const resultsDiv = document.getElementById('search-results');
                resultsDiv.innerHTML = '';

                const hasLaptops = Array.isArray(laptops) && laptops.length > 0;
                const hasMobiles = Array.isArray(mobiles) && mobiles.length > 0;

                if (!hasLaptops && !hasMobiles) {
                    resultsDiv.innerHTML = "<p>No products found.</p>";
                    return;
                }

                if (hasLaptops) {
                    const header = document.createElement('h3');
                    header.style.marginTop = '0.5rem';
                    header.textContent = 'Laptops';
                    resultsDiv.appendChild(header);
                    renderProductResults(laptops, 'laptop');
                }

                if (hasMobiles) {
                    const header = document.createElement('h3');
                    header.style.marginTop = '1.5rem';
                    header.textContent = 'Mobile Phones';
                    resultsDiv.appendChild(header);
                    renderProductResults(mobiles, 'mobile');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('search-results').innerHTML = "<p>Failed to load products.</p>";
            }
        }

        function renderProductResults(items, type) {
            const resultsDiv = document.getElementById('search-results');

            if (!Array.isArray(items) || items.length === 0) {
                return;
            }

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'glass-panel';
                el.innerHTML = `
                    <h3>${item.brand} - ${item.model}</h3>
                    <p>Price: $${item.price}</p>
                    ${type === 'laptop' ? `<p>Specs: ${item.specs}</p>` : `<p>Storage: ${item.storage} | Color: ${item.color}</p>`}
                    <button class="btn btn-primary btn-small" onclick="addToCart(${item.id}, '${type}')">Add to Cart</button>
                `;
                resultsDiv.appendChild(el);
            });
        }

        async function addToCart(itemId, serviceType) {
            try {
                if (!customerId) {
                    alert("Please login before adding to cart.");
                    return;
                }
                const res = await fetch(`${API_URL}/customer/carts/${customerId}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        item_id: itemId,
                        service_type: serviceType,
                        quantity: 1
                    })
                });
                if (res.ok) {
                    alert("Added to cart!");
                    loadCart();
                } else {
                    let detail = "";
                    try {
                        const err = await res.json();
                        detail = err?.detail ? ` ${err.detail}` : "";
                    } catch (_) {}
                    alert("Failed to add to cart." + detail);
                }
            } catch (err) {
                alert("Error adding to cart.");
            }
        }

        async function loadCart() {
            try {
                if (!customerId) {
                    document.getElementById('cart-items').innerHTML = "<p>Please login to view your cart.</p>";
                    return;
                }
                const res = await fetch(`${API_URL}/customer/carts/${customerId}`);
                if (!res.ok) {
                    document.getElementById('cart-items').innerHTML = "<p>Failed to load cart.</p>";
                    return;
                }
                const data = await res.json();
                
                const cartDiv = document.getElementById('cart-items');
                if (!data.items || data.items.length === 0) {
                    cartDiv.innerHTML = "<p>Your cart is empty.</p>";
                    return;
                }

                cartDiv.innerHTML = data.items.map(item => `
                    <div style="padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 0.5rem;">
                        <strong>Type:</strong> ${item.service_type} | <strong>Item ID:</strong> ${item.item_id} | <strong>Quantity:</strong> ${item.quantity}
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function loadStaffItems() {
            try {
                const res = await fetch(`${API_URL}/staff/items/`);
                const data = await res.json();

                const staffDiv = document.getElementById('staff-items');
                if (!Array.isArray(data) || data.length === 0) {
                    staffDiv.innerHTML = "<p>No staff items available.</p>";
                    return;
                }

                staffDiv.innerHTML = data.map(item => {
                    const isAvailable = item.status === 'Assigned';
                    return `
                        <div style="padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 0.5rem;">
                            <strong>${item.name}</strong> | <strong>Serial:</strong> ${item.serial_number}
                            <div style="margin-top: 0.25rem; color: var(--text-muted);">Status: ${item.status}</div>
                            <div style="margin-top: 0.5rem;">
                                <button class="btn btn-primary btn-small" onclick="addToCart(${item.id}, 'staff')" ${isAvailable ? '' : 'disabled'}>
                                    ${isAvailable ? 'Add to Cart' : 'Unavailable'}
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('staff-items').innerHTML = "<p>Failed to load staff items.</p>";
            }
        }

        window.onload = init;
    </script>
</head>
<body>
    <div class="container">
        <nav class="nav-links">
            <a href="index.html">⬅️ Hub</a>
        </nav>

        <h1>🛍️ Customer Portal</h1>

        <!-- Authentication -->
        <div id="auth-section" class="glass-panel" style="max-width: 400px; margin: 0 auto; display: none;">
            <h2>Login / Register</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="customer@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button class="btn btn-primary" onclick="handleLogin(event)">Login</button>
                    <button class="btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="handleRegister(event)">Register</button>
                </div>
            </form>
        </div>

        <!-- Main App Area -->
        <div id="main-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 id="welcome-msg" style="border: none; margin: 0;"></h2>
                <button class="btn btn-small" style="width: auto; background: rgba(239, 68, 68, 0.2); color: #fca5a5;" onclick="logout()">Logout</button>
            </div>

            <div class="grid">
                <!-- Search -->
                <div class="glass-panel">
                    <h2>🔍 Search Products</h2>
                    <form onsubmit="searchProducts(event)">
                        <div class="form-group">
                            <label>Product Type</label>
                            <select id="search-type">
                                <option value="laptop">Laptops</option>
                                <option value="mobile">Mobile Phones</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Keyword</label>
                            <input type="text" id="search-query" placeholder="e.g. Dell, iPhone...">
                        </div>
                        <button type="submit" class="btn btn-primary">Search</button>
                    </form>

                    <div id="search-results" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Results injected here -->
                    </div>
                </div>

                <!-- Staff Items -->
                <div class="glass-panel" style="align-self: flex-start;">
                    <h2>🧰 Staff Items</h2>
                    <button class="btn btn-small" style="margin-bottom: 1rem; width: auto; background: rgba(255,255,255,0.1); color: white;" onclick="loadStaffItems()">Refresh List</button>
                    <div id="staff-items">
                        <p>Loading staff items...</p>
                    </div>
                </div>

                <!-- Cart -->
                <div class="glass-panel" style="align-self: flex-start;">
                    <h2>🛒 Your Cart</h2>
                    <div id="cart-items">
                        <p>Loading cart...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
